<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://upload.wikimedia.org; media-src 'self' https://upload.wikimedia.org; img-src 'self' data:;">
    <title>日語刷題 PWA</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e1e8ed;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; padding: 16px; }
        .container { max-width: 600px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
        header { text-align: center; padding: 10px 0; }
        h1 { font-size: 1.5rem; color: var(--primary-color); }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border-color); text-align: center; }
        .kana-display { font-size: 3rem; font-weight: bold; margin: 15px 0; color: #2c3e50; }
        button { background-color: var(--primary-color); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin: 5px; }
        button:active { transform: scale(0.98); }
        button:hover { opacity: 0.9; }
        .app-footer { text-align: center; padding: 12px; font-size: 0.8rem; color: #666; margin-top: auto; border-top: 1px solid var(--border-color); }
        .app-footer a { color: var(--primary-color); text-decoration: none; }
        .app-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>日語 50音刷題學習系統</h1>
    </header>

    <div class="card">
        <p>點擊下方按鈕測試真人發音（防吃音機制）</p>
        <div id="kanaBox" class="kana-display">あ</div>
        <button onclick="playCurrentKana()">播放標準發音</button>
        <button onclick="nextKana()">切換下一個字</button>
    </div>

    <footer class="app-footer">
        <small>
            50音真人發音取自 
            <a href="https://commons.wikimedia.org" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a> 
            (依循 Creative Commons 授權)。
        </small>
    </footer>
</div>

<script>
    // 資安防護：跳脫處理（防範 XSS）
    function escapeHTML(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    const sampleKanas = ['あ', 'い', 'う', 'え', 'お', 'か', 'き', 'く', 'け', 'こ', 'さ', 'し', 'す', 'せ', 'そ'];
    let currentIndex = 0;

    function nextKana() {
        currentIndex = (currentIndex + 1) % sampleKanas.length;
        const safeText = escapeHTML(sampleKanas[currentIndex]);
        document.getElementById('kanaBox').innerHTML = safeText;
        playCurrentKana();
    }

    // 發音核心（含開源音檔與系統備用機制）
    function speakText(text, isSlow = false) {
        const cleanText = String(text).trim();
        if (!cleanText) return;

        const kanaWikiMap = {
            'あ':'https://upload.wikimedia.org/wikipedia/commons/2/29/Ja-a.oga',
            'い':'https://upload.wikimedia.org/wikipedia/commons/d/d7/Ja-i.oga',
            'う':'https://upload.wikimedia.org/wikipedia/commons/e/e0/Ja-u.oga',
            'え':'https://upload.wikimedia.org/wikipedia/commons/8/8c/Ja-e.oga',
            'お':'https://upload.wikimedia.org/wikipedia/commons/2/23/Ja-o.oga',
            'か':'https://upload.wikimedia.org/wikipedia/commons/b/b1/Ja-ka.oga',
            'き':'https://upload.wikimedia.org/wikipedia/commons/0/07/Ja-ki.oga',
            'く':'https://upload.wikimedia.org/wikipedia/commons/b/b7/Ja-ku.oga',
            'け':'https://upload.wikimedia.org/wikipedia/commons/a/a2/Ja-ke.oga',
            'こ':'https://upload.wikimedia.org/wikipedia/commons/2/27/Ja-ko.oga',
            'さ':'https://upload.wikimedia.org/wikipedia/commons/c/c3/Ja-sa.oga',
            'し':'https://upload.wikimedia.org/wikipedia/commons/4/42/Ja-shi.oga',
            'す':'https://upload.wikimedia.org/wikipedia/commons/c/c5/Ja-su.oga',
            'せ':'https://upload.wikimedia.org/wikipedia/commons/5/52/Ja-se.oga',
            'そ':'https://upload.wikimedia.org/wikipedia/commons/9/9f/Ja-so.oga'
        };

        const audioUrl = kanaWikiMap[cleanText];

        if (audioUrl) {
            const audio = new Audio(audioUrl);
            audio.playbackRate = isSlow ? 0.75 : 1.0;
            audio.play().catch(err => {
                console.warn("音檔播放受阻，啟動語音合成備用方案", err);
                fallbackSpeechSynthesis(cleanText, isSlow);
            });
        } else {
            fallbackSpeechSynthesis(cleanText, isSlow);
        }
    }

    function fallbackSpeechSynthesis(text, isSlow) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = isSlow ? 0.6 : 0.8;
            window.speechSynthesis.speak(utterance);
        }, 100);
    }

    function playCurrentKana() {
        const currentText = sampleKanas[currentIndex];
        speakText(currentText);
    }
</script>

</body>
</html>
